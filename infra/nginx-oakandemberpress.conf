# Oak & Ember Press — nginx site (HTTP). certbot --nginx adds the 443 block and the redirect.
# Installed at /etc/nginx/sites-available/oakandemberpress.conf by install-nginx.sh.
server {
    listen 80;
    listen [::]:80;
    server_name oakandemberpress.com www.oakandemberpress.com;

    root /srv/www/oakandemberpress.com;
    index index.html;

    # Astro's hashed assets never change
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~ ^/(brand|catalog)/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    error_page 404 /404.html;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    access_log /var/log/nginx/oakandemberpress.access.log;
    error_log  /var/log/nginx/oakandemberpress.error.log;
}
